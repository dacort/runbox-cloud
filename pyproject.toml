[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-run"
version = "0.1.1"
description = "Cloud execution platform - run executables on AWS and DigitalOcean instances"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.38.8",
    "boto3-stubs>=1.39.4",
    "click>=8.1.8",
    "pydo>=0.4.0",
    "pyyaml>=6.0.2",
    "pyssm-client>=0.1.1",
    "rich>=14.1.0",
]

[project.scripts]
cloud-run = "runbox.main:cli"

